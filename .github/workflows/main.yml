          async function packMod(z,fmt,btn){
            const old=btn.textContent;btn.disabled=true;
            try{
              const refs=$('#refs').checked, ext=fmt==='png'?'png':$('#ext').value, opq=$('#opaque').checked;
              const map=new Map(items.filter(it=>it.z===z).map(it=>[it.path,it]));
              const out=[], keep=new Set(), texts=new Map();
              const bn=p=>p.split('/').pop().toLowerCase();
              for(const en of z.all){
                if(!/\.xml$/i.test(en.name))continue;
                try{
                  const t=new TextDecoder().decode(await extractEntry(z.buf,en));texts.set(en.name,t);
                  for(const m of t.matchAll(/<(iconFilename|image)\b[^>]*>\s*([^<]*?)\s*<\/\1>/gi))if(/\.dds$/i.test(m[2]))keep.add(bn(m[2]));
                  for(const m of t.matchAll(/\b(?:iconFilename|imageFilename|filenameIcon|icon|image)\s*=\s*"([^"]+\.dds)"/gi))keep.add(bn(m[1]));
                }catch(e){}
              }
              const isIcon=n=>$('#keepicon').checked&&(keep.has(bn(n))||/^(icon|store)/i.test(bn(n)));
              const conv=new Set([...map.keys()].filter(n=>!isIcon(n)).map(bn));
              for(let i=0;i<z.all.length;i++){
                const en=z.all[i];
                if(en.name.endsWith('/'))continue;
                const it=map.get(en.name);
                if(it&&!isIcon(en.name)){
                  btn.textContent='Convertendo '+(i+1)+'/'+z.all.length+'…';
                  await new Promise(r=>setTimeout(r,0));
                  const data=fmt==='png'?new Uint8Array(await (await pngBlob(it)).arrayBuffer()):await buildAst(it,SC(),FL());
                  out.push({name:en.name.replace(IMG,'.'+ext),data,method:0,crc:crc32(data),usz:data.length});
                  setProg(i+1,z.all.length,'Gerando o mod');
                  continue;
                }
                if(refs&&/\.(xml|i3d|lua|txt)$/i.test(en.name)){
                  const txt=texts.get(en.name)??new TextDecoder().decode(await extractEntry(z.buf,en));
                  const t2=txt.replace(/([^"'<>\s=]*)\.dds\b/gi,(m,p)=>(/^\$/.test(p)||!conv.has(bn(p+'.dds')))?m:p+'.'+ext);
                  if(t2!==txt){const d=new TextEncoder().encode(t2);out.push({name:en.name,data:d,method:0,crc:crc32(d),usz:d.length});continue;}
                }
                out.push({name:en.name,data:rawBytes(z.buf,en),method:en.method,crc:en.crc,usz:en.usz});
              }
              setProg(1,1,'Mod pronto');
              await saveBlob(zipRaw(out),z.name.replace(/\.zip$/i,'')+'-convertido-'+fmt+'.zip');
            }catch(e){alert('Falha ao gerar o mod: '+(e.message||e));}
            btn.disabled=false;btn.textContent=old;
          }
