          function zipRaw(files){
            const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
            for(const f of files){
              const n=enc.encode(f.name), sz=f.data.length;
              const lh=new DataView(new ArrayBuffer(30));
              lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,f.method,true);lh.setUint16(12,0x21,true);
