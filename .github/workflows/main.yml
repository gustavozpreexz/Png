          button.ghost{background:transparent;color:var(--ink);border:1px solid var(--muted)}
          button.ghost:hover{background:color-mix(in srgb,var(--ink) 6%,transparent)}
          .drop{border:1px solid var(--line);border-radius:6px;padding:30px 18px;background:repeating-linear-gradient(0deg,transparent 0 9px,var(--line) 9px 10px),var(--surface)}
          .drop::before{content:none}
          .drop strong{background:var(--accent);color:var(--on-accent);border-radius:6px;padding:10px 18px}
          .drop span{text-shadow:none;color:var(--muted);background:var(--surface);padding:2px 8px;display:inline-block}
          .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;box-shadow:none}
          .opts{background:none;border-radius:0;border-bottom:1px solid var(--line);padding:11px 0;margin:0;color:var(--muted)}
          .hint{color:var(--muted);font-size:.85rem}
          select,input[type=search],.meta input,.prop input,textarea{border-radius:6px}

