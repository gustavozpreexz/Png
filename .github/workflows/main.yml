name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Criar projeto
        run: |
          mkdir -p app/src/main/java/com/ddsconverter/app app/src/main/assets app/src/main/res/mipmap-xxhdpi
          cat > settings.gradle <<'FIM_0_ARQUIVO'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "DDSparaPNG"
          include ':app'
          FIM_0_ARQUIVO
          cat > build.gradle <<'FIM_1_ARQUIVO'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          FIM_1_ARQUIVO
          cat > gradle.properties <<'FIM_2_ARQUIVO'
          org.gradle.jvmargs=-Xmx2g
          android.nonTransitiveRClass=true
          FIM_2_ARQUIVO
          cat > app/build.gradle <<'FIM_3_ARQUIVO'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.ddsconverter.app'
              compileSdk 34
              defaultConfig {
                  applicationId "com.ddsconverter.app"
                  minSdk 29
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          FIM_3_ARQUIVO
          cat > app/src/main/AndroidManifest.xml <<'FIM_4_ARQUIVO'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="DDS para PNG" android:allowBackup="true" android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          FIM_4_ARQUIVO
          cat > app/src/main/java/com/ddsconverter/app/MainActivity.java <<'FIM_5_ARQUIVO'
          package com.ddsconverter.app;

          import android.app.Activity;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Environment;
          import android.provider.MediaStore;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import java.io.OutputStream;

          public class MainActivity extends Activity {
              private static final int REQ = 1;
              private WebView web;
              private ValueCallback<Uri[]> pending;

              @Override protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  web = new WebView(this);
                  setContentView(web);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "AndroidBridge");
                  web.setWebViewClient(new WebViewClient());
                  web.setWebChromeClient(new WebChromeClient() {
                      @Override public boolean onShowFileChooser(WebView v, ValueCallback<Uri[]> cb, FileChooserParams p) {
                          if (pending != null) pending.onReceiveValue(null);
                          pending = cb;
                          Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                          i.addCategory(Intent.CATEGORY_OPENABLE);
                          i.setType("*/*");
                          i.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(Intent.createChooser(i, "Escolher arquivos"), REQ);
                          } catch (Exception e) {
                              pending = null;
                              cb.onReceiveValue(null);
                              return false;
                          }
                          return true;
                      }
                  });
                  web.loadUrl("file:///android_asset/index.html");
              }

              @Override protected void onActivityResult(int req, int res, Intent data) {
                  if (req == REQ && pending != null) {
                      pending.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                      pending = null;
                  } else {
                      super.onActivityResult(req, res, data);
                  }
              }

              @Override public void onBackPressed() {
                  if (web.canGoBack()) web.goBack(); else super.onBackPressed();
              }

              class Bridge {
                  @JavascriptInterface public String save(String name, String b64) {
                      try {
                          byte[] d = Base64.decode(b64, Base64.DEFAULT);
                          final String safe = name.replace('/', '_');
                          String l = safe.toLowerCase();
                          String mime = l.endsWith(".zip") ? "application/zip" : l.endsWith(".png") ? "image/png" : "application/octet-stream";
                          ContentValues v = new ContentValues();
                          v.put(MediaStore.Downloads.DISPLAY_NAME, safe);
                          v.put(MediaStore.Downloads.MIME_TYPE, mime);
                          v.put(MediaStore.Downloads.RELATIVE_PATH, Environment.DIRECTORY_DOWNLOADS);
                          Uri u = getContentResolver().insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                          try (OutputStream o = getContentResolver().openOutputStream(u)) { o.write(d); }
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Salvo em Downloads: " + safe, Toast.LENGTH_LONG).show());
                          return "ok";
                      } catch (Exception e) {
                          final String m = String.valueOf(e);
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Erro ao salvar: " + m, Toast.LENGTH_LONG).show());
                          return "erro";
                      }
                  }
              }
          }
          FIM_5_ARQUIVO
          cat > app/src/main/assets/index.html <<'FIM_6_ARQUIVO'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <title>DDS para PNG</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Figtree:wght@400;600&display=swap">
          <style>
          :root{--bg:#eceef5;--surface:#fff;--ink:#1c2040;--muted:#5d6382;--line:#c9cde0;--accent:#2f4bff;--on-accent:#fff;--ck1:#dfe2ee;--ck2:#f6f7fb;--err:#b3261e;
          box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#13152a;--surface:#1c1f3a;--ink:#eceefb;--muted:#9fa5c9;--line:#363a63;--accent:#7e91ff;--on-accent:#10132b;--ck1:#2a2e52;--ck2:#222644;--err:#ffb4ab}}
          :root[data-theme="dark"]{--bg:#13152a;--surface:#1c1f3a;--ink:#eceefb;--muted:#9fa5c9;--line:#363a63;--accent:#7e91ff;--on-accent:#10132b;--ck1:#2a2e52;--ck2:#222644;--err:#ffb4ab}
          html{scroll-padding-top:env(safe-area-inset-top,0px)}
          *,*::before,*::after{box-sizing:inherit}
          body{margin:0;background:#1b1d2b;color:var(--ink);font:400 16px/1.5 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
          body::before{content:none}
          main{width:min(720px,calc(100% - 20px));margin:14px auto 24px;padding:24px 18px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-radius:20px}
          select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
          .btns{display:flex;gap:8px;flex-wrap:wrap}
          button:disabled{opacity:.6;cursor:progress}
          [hidden]{display:none!important}
          .tabs{display:flex;gap:8px;margin-bottom:16px}
          .tabs button{flex:1}
          .tabs button[aria-pressed="false"]{background:transparent;color:var(--ink);border:1px solid var(--line)}
          #flist{display:grid;gap:10px;margin-top:14px}
          input[type=search],.meta input{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
          input[type=search]{width:100%;margin-top:12px}
          .meta input{flex:1 1 120px}
          textarea{display:block;width:100%;min-height:50vh;border:0;border-top:1px solid var(--line);padding:12px;background:var(--surface);color:var(--ink);font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;white-space:pre;overflow:auto;tab-size:2;resize:vertical}
          #ed{margin-top:14px}
          h1{font:700 clamp(2rem,9vw,3rem)/1.05 "Bricolage Grotesque",Figtree,system-ui,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
          .lead{color:var(--muted);margin:0 0 22px;max-width:52ch}
          .drop{display:block;border:2px dashed var(--line);border-radius:16px;padding:30px 18px;text-align:center;cursor:pointer;background:
          conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/20px 20px;transition:border-color .15s}
          .drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
          .drop strong{display:inline-block;background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:600}
          .drop span{display:block;margin-top:10px;color:var(--ink);font-size:.95rem;text-shadow:0 0 6px var(--bg),0 0 6px var(--bg)}
          .drop input{position:absolute;opacity:0;width:1px;height:1px}
          .opts{display:flex;gap:10px;align-items:center;margin:16px 0 4px;color:var(--muted);font-size:.95rem}
          .opts input{width:20px;height:20px;accent-color:var(--accent)}
          #list{display:grid;gap:14px;margin-top:18px}
          .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
          .pic{background:conic-gradient(var(--ck1) 25%,var(--ck2) 0 50%,var(--ck1) 0 75%,var(--ck2) 0) 0 0/16px 16px;display:flex;justify-content:center;padding:10px}
          .pic canvas{max-width:100%;height:auto;max-height:60vh;image-rendering:auto}
          .meta{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;flex-wrap:wrap}
          .meta b{display:block;overflow-wrap:anywhere;font-weight:600}
          .meta small{color:var(--muted)}
          button{font:600 1rem Figtree,system-ui,sans-serif;background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:44px}
          button:focus-visible,.drop:focus-within{outline:3px solid var(--accent);outline-offset:2px}
          button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
          .err{padding:14px;color:var(--err)}
          .bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
          .hint{color:var(--muted);font-size:.9rem;margin-top:22px}

          /* ===== visual v2 ===== */
          main{border:1px solid rgba(255,255,255,.2);box-shadow:0 24px 70px rgba(0,0,0,.45);border-radius:24px;padding:26px 18px 34px;background:color-mix(in srgb,var(--surface) 80%,transparent)}
          h1{background:linear-gradient(90deg,var(--accent),#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
          .lead{font-size:1.02rem}
          button{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#8a5cff));border-radius:12px;box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .1s,filter .15s}
          button:hover{filter:brightness(1.08)}button:active{transform:scale(.97)}
          button.ghost,.tabs button[aria-pressed="false"]{box-shadow:none;background:transparent}
          .tabs{background:color-mix(in srgb,var(--bg) 70%,transparent);padding:5px;border-radius:16px;border:1px solid var(--line)}
          .tabs button{min-height:42px;padding:8px 6px;font-size:.92rem}
          .tabs button[aria-pressed="false"]{border-color:transparent;color:var(--muted)}
          .drop{border-radius:20px;padding:34px 18px}
          .drop::before{content:"\2B06";display:block;font-size:2rem;line-height:1;margin-bottom:10px}
          .card{border-radius:16px;box-shadow:0 8px 24px rgba(10,14,40,.14)}
          .meta b{font-weight:700}
          .opts{background:color-mix(in srgb,var(--bg) 60%,transparent);padding:8px 12px;border-radius:12px;margin:8px 0 0}
          .hint{line-height:1.5}
          .panes{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
          #tree{max-height:42vh;overflow:auto;border-bottom:1px solid var(--line)}
          .node{display:block;width:100%;text-align:left;background:transparent!important;color:var(--ink);border:0;border-radius:0;box-shadow:none;min-height:36px;padding:6px 10px;font:500 .88rem Figtree,system-ui,sans-serif;white-space:nowrap}
          .node.sel{background:var(--accent)!important;color:var(--on-accent)}
          #props,#i3dfiles{padding:12px;display:grid;gap:8px}
          .prop{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;font-size:.82rem;color:var(--muted)}
          .prop input{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
          @media(min-width:700px){.panes{grid-template-columns:1fr 1fr}#tree{border-bottom:0;border-right:1px solid var(--line);max-height:55vh}}

          /* ===== visual agrícola minimalista ===== */
          :root{--bg:#eee7d6;--surface:#f7f2e5;--ink:#2a281d;--muted:#6d684f;--line:#d3c9ad;--accent:#3d6b34;--on-accent:#f7f2e5;--ck1:#e2d9c0;--ck2:#f1ebd9;--err:#9b2c1f}
          @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1c14;--surface:#26251b;--ink:#ebe4cf;--muted:#a39c81;--line:#3a392a;--accent:#8db46f;--on-accent:#18200f;--ck1:#2d2c20;--ck2:#232218;--err:#f0a595}}
          :root[data-theme="dark"]{--bg:#1d1c14;--surface:#26251b;--ink:#ebe4cf;--muted:#a39c81;--line:#3a392a;--accent:#8db46f;--on-accent:#18200f;--ck1:#2d2c20;--ck2:#232218;--err:#f0a595}
          body{background:var(--bg)}
          main{width:min(680px,100%);margin:0 auto;padding:30px 18px 44px;background:none;border:0;border-radius:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
          h1{font-family:Fraunces,Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;background:none;color:var(--ink);-webkit-background-clip:border-box;background-clip:border-box;display:block;margin-bottom:0}
          h1::after{content:"";display:block;width:76px;height:12px;margin-top:14px;background:repeating-linear-gradient(90deg,var(--accent) 0 2px,transparent 2px 8px)}
          .lead{color:var(--muted);margin:16px 0 26px;font-size:1rem}
          .tabs{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;gap:20px;margin-bottom:22px}
          .tabs button,.tabs button[aria-pressed="false"],.tabs button[aria-pressed="true"]{flex:0 0 auto;background:none;box-shadow:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:10px 0;min-height:44px;font-size:.95rem;color:var(--muted)}
