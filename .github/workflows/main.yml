          <body>
          <main>
          <h1>DDS para PNG</h1>
          <p class="lead">Escolha um ou mais arquivos .dds e baixe cada um como PNG ou AST. A conversão acontece no seu aparelho: nada é enviado a servidores.</p>

          <div class="tabs"><button id="tabC" aria-pressed="true">Converter</button><button id="tabE" aria-pressed="false">Editar</button><button id="tabI" aria-pressed="false">I3D</button><button id="tabM" aria-pressed="false">Criar mod</button><button id="tabD" aria-pressed="false">Modelar</button></div>
          <div id="prog" hidden><div class="pbar"><i id="pfill"></i></div><div class="ptxt"><span id="plab"></span><b id="pct">0%</b></div></div>

          <div id="viewConv">
          <label class="drop" id="drop">
            <input type="file" id="file" accept=".dds,.zip,application/zip" multiple>
            <strong>Escolher DDS ou ZIP</strong>
            <span>ou arraste-os para cá. Um .zip é aberto e todos os .dds dentro dele são convertidos</span>
          </label>

          <div class="bar"><button class="ghost" id="pickdir">Escolher uma pasta</button><input type="file" id="dir" webkitdirectory multiple hidden></div>
          <label class="opts"><input type="checkbox" id="opaque"> Remover transparência (fundo opaco)</label>

          <label class="opts"><input type="checkbox" id="keepicon"> Manter o ícone do mod e as imagens da loja em .dds (não converter)</label>
          <label class="opts"><input type="checkbox" id="refs" checked> Ao gerar o mod, atualizar as referências .dds nos arquivos .xml/.i3d/.lua</label>
          <label class="opts">Escala <select id="scale"><option value="0.5">50% (padrão do script)</option><option value="0.25">25%</option><option value="0.75">75%</option><option value="1">100%</option></select><select id="ext" hidden><option value="ast">ast</option></select></label>
          <label class="opts"><input type="checkbox" id="flip" checked> Inverter verticalmente (igual ao script)</label>

          <p class="hint" id="status" aria-live="polite"></p>
          <div id="modbar" style="display:grid;gap:10px;margin-top:14px"></div>
          <details id="fl" style="margin-top:14px"><summary>Arquivos lidos (<span id="cnt">0</span>)</summary><div id="list" aria-live="polite"></div></details>
          <div class="bar" id="bar" hidden><button id="all">Baixar todos (PNG em .zip)</button><button id="allast">Baixar todos (AST em .zip)</button><button class="ghost" id="clear">Limpar lista</button></div>
          </div>

          <div id="viewEdit" hidden>
            <label class="drop" id="dropE">
              <input type="file" id="fileE" accept=".zip,application/zip">
              <strong>Abrir mod (.zip)</strong>
              <span>para editar textos, trocar ou excluir arquivos (serve para FS19, FS22 e FS25)</span>
            </label>
            <p class="hint" id="modinfo"></p>
            <div class="card" id="ed" hidden>
              <div class="meta"><b id="edname"></b><div class="btns"><button id="edsave">Salvar</button><button class="ghost" id="edclose">Fechar</button></div></div>
              <div class="meta"><input id="fnd" placeholder="Localizar"><input id="rpl" placeholder="Trocar por"><button class="ghost" id="edrepl">Trocar tudo</button></div>
              <textarea id="edtext" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
            </div>
            <input type="search" id="filt" placeholder="Filtrar arquivos…" hidden>
            <div id="flist"></div>
            <div class="bar" id="ebar" hidden><button id="dlmod">Baixar mod editado</button></div>
          </div>

          <div id="viewI3d" hidden>
            <label class="drop" id="dropI">
              <input type="file" id="fileI" accept=".i3d,.xml">
              <strong>Abrir arquivo .i3d</strong>
              <span>ou use o botão “I3D” na lista de arquivos de um mod aberto em “Editar mod”</span>
            </label>
            <div class="card" id="i3dcard" hidden style="margin-top:14px">
              <div class="meta"><div><b id="i3dname"></b><br><small id="i3dstat"></small></div><div class="btns"><button id="i3dapply">Aplicar no mod</button><button class="ghost" id="i3ddl">Baixar (.xml)</button></div></div>
              <div class="panes"><div id="tree"></div><div id="props"></div></div>
              <div class="meta" style="border-top:1px solid var(--line)"><b>Texturas e arquivos (Files)</b><button class="ghost" id="i3dext">Trocar .dds pela extensão do AST</button></div>
              <div id="i3dfiles"></div>
            </div>
            <p class="hint">Este editor altera a estrutura do .i3d: nós da cena, nomes, posição, rotação, escala, visibilidade, atributos e caminhos de texturas. Não é o GIANTS Editor completo: não há janela 3D, nem edição de malhas (.shapes), nem exportação.</p>
          </div>

          <div id="viewMake" hidden>
            <div class="card"><div style="padding:14px;display:grid;gap:10px">
              <b>Novo mod</b>
              <label class="prop"><span>Nome</span><input id="mkName" placeholder="Meu Mod"></label>
              <label class="prop"><span>Autor</span><input id="mkAuthor"></label>
              <label class="prop"><span>Versão</span><input id="mkVer" value="1.0.0.0"></label>
              <label class="prop"><span>descVersion</span><input id="mkDesc" placeholder="o número do seu jogo"></label>
              <label class="prop"><span>Descrição</span><input id="mkText"></label>
              <label class="opts"><input type="checkbox" id="mkI3d"> Incluir cena .i3d vazia para editar na aba I3D</label>
            </div></div>
            <label class="drop" id="dropM" style="margin-top:14px">
              <input type="file" id="mkFiles" multiple>
              <strong>Adicionar arquivos</strong>
              <span>imagens (DDS, PNG, JPG) viram .ast; os outros arquivos entram sem mudança. Um arquivo chamado icon.* vira o ícone do mod</span>
            </label>
            <div id="mkList"></div>
            <div class="bar"><button id="mkBuild">Baixar mod (.zip)</button></div>
            <p class="hint">Cria o <b>modDesc.xml</b> e empacota seus arquivos. A escala e o flip usados nas texturas são os da aba Converter. Para criar formas 3D simples, use a aba Modelar; modelos complexos podem vir do Blender ou do GIANTS Editor (adicione o .i3d e o .shapes pelo botão acima).</p>
          </div>

          <div id="viewModel" hidden>
            <div class="card">
              <canvas id="mcv" style="display:block;width:100%;height:52vh;touch-action:none"></canvas>
              <div class="meta" style="border-top:1px solid var(--line)"><div class="btns">
                <button data-t="box">Cubo</button><button data-t="cyl">Cilindro</button><button data-t="sph">Esfera</button><button data-t="cone">Cone</button><button data-t="plane">Plano</button>
              </div></div>
            </div>
            <div class="card" style="margin-top:12px">
              <div class="btns" id="mList" style="padding:10px"></div>
              <div id="mProps" style="padding:12px;display:grid;gap:8px;border-top:1px solid var(--line)"></div>
            </div>
            <label class="prop" style="margin-top:12px"><span>Nome do modelo</span><input id="mName" value="meu_modelo"></label>
            <div class="bar"><button id="mOpen">Abrir no Editor I3D</button><button class="ghost" id="mDl">Baixar .i3d (.zip)</button><button class="ghost" id="mSend">Enviar para Criar mod</button></div>
            <p class="hint">Arraste para girar, pince (ou use a roda) para aproximar e toque num objeto para selecioná-lo. Mova, gire, redimensione e pinte as formas pelos campos. Não é o GIANTS Editor: não há edição de vértices, UVs, animações nem shaders. O .i3d sai com malhas em texto e deve ser conferido no GIANTS Editor (a ordem de rotação e o sentido das faces podem precisar de ajuste).</p>
          </div>

          <p class="hint">Entrada: DXT1, DXT3, DXT5 (BC1–BC3), BC4, BC5 e pixels sem compressão (RGB/RGBA/BGRA, incluindo cabeçalho DX10); só o primeiro nível de mipmap. BC6H e BC7 ainda não são suportados. O AST segue o formato GS2D do BH AST Converter (ASTC 6×6 com mipmaps, escala e tamanhos por nome de textura) e é entregue dentro de um .zip, porque o visualizador só permite salvar alguns tipos de arquivo. Extraia o .zip para obter o arquivo. Ao abrir um .zip ou uma pasta, a estrutura de pastas é mantida nas conversões em lote. Com um .zip de mod, os botões “Baixar mod com PNG/AST” geram uma cópia do mod com cada .dds já trocada pelo arquivo convertido, no mesmo lugar. Atenção: o Farming Simulator de PC carrega texturas em .dds. Se o seu jogo só aceita AST, use “Baixar mod com AST”: o ícone do mod também é convertido, a menos que você marque a opção de mantê-lo em .dds. Use isso para edição ou testes e guarde o mod original.</p>
          </main>

          <script>
          /* Ponte com o Android: salva arquivos na pasta Downloads */
          window.claude={use:async n=>n==='downloads'?{save:({filename,data})=>new Promise((res,rej)=>{
            const fr=new FileReader();
            fr.onload=()=>{try{AndroidBridge.save(filename,String(fr.result).split(',')[1]);res({status:'saved'});}catch(e){rej({code:'unavailable',message:String(e)});}};
            fr.onerror=()=>rej({code:'unavailable',message:'falha ao ler o arquivo'});
            fr.readAsDataURL(data instanceof Blob?data:new Blob([data]));})}:null};
          </script>
          <script>
          const $ = s => document.querySelector(s);
          const items = [];
          const FC = s => (s.charCodeAt(0) | s.charCodeAt(1) << 8 | s.charCodeAt(2) << 16 | s.charCodeAt(3) << 24) >>> 0;

          function c565(v){return [((v>>11&31)*255/31+.5)|0, ((v>>5&63)*255/63+.5)|0, ((v&31)*255/31+.5)|0];}

          function alphaBlock(dv,p){
            const a0=dv.getUint8(p), a1=dv.getUint8(p+1), t=[a0,a1];
            if(a0>a1){for(let i=1;i<7;i++)t.push(((7-i)*a0+i*a1)/7|0);}
            else{for(let i=1;i<5;i++)t.push(((5-i)*a0+i*a1)/5|0);t.push(0,255);}
            const bits=dv.getUint32(p+2,true)+dv.getUint16(p+6,true)*4294967296, r=new Uint8Array(16);
            for(let i=0;i<16;i++)r[i]=t[Math.floor(bits/2**(3*i))%8];
            return r;
          }

          function decodeBlocks(dv,o,w,h,kind){
            const out=new Uint8ClampedArray(w*h*4), bw=(w+3)>>2, bh=(h+3)>>2;
            const size=(kind==='bc1'||kind==='bc4')?8:16, px=new Uint8Array(64);
            for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++){
              const p=o+(by*bw+bx)*size;
              if(p+size>dv.byteLength)throw new Error('O arquivo parece estar incompleto.');
              if(kind==='bc4'||kind==='bc5'){
                const r=alphaBlock(dv,p), g=kind==='bc5'?alphaBlock(dv,p+8):r;
                for(let i=0;i<16;i++){px[i*4]=r[i];px[i*4+1]=g[i];px[i*4+2]=kind==='bc5'?0:r[i];px[i*4+3]=255;}
              }else{
                const cp=kind==='bc1'?p:p+8, c0=dv.getUint16(cp,true), c1=dv.getUint16(cp+2,true);
                const a=c565(c0), b=c565(c1), four=kind!=='bc1'||c0>c1, pal=[a,b];
                if(four){pal.push(a.map((v,i)=>((2*v+b[i])/3)|0),a.map((v,i)=>((v+2*b[i])/3)|0));}
                else{pal.push(a.map((v,i)=>((v+b[i])>>1)),[0,0,0]);}
                const bits=dv.getUint32(cp+4,true);
                let al=null; if(kind==='bc3')al=alphaBlock(dv,p);
                for(let i=0;i<16;i++){
                  const idx=bits>>(2*i)&3, c=pal[idx];
                  px[i*4]=c[0];px[i*4+1]=c[1];px[i*4+2]=c[2];
                  let A=255;
                  if(kind==='bc1'&&!four&&idx===3)A=0;
                  else if(kind==='bc2'){const by2=dv.getUint8(p+(i>>1));A=(i&1?by2>>4:by2&15)*17;}
                  else if(kind==='bc3')A=al[i];
                  px[i*4+3]=A;
                }
              }
              for(let y=0;y<4;y++){const yy=by*4+y;if(yy>=h)break;
                for(let x=0;x<4;x++){const xx=bx*4+x;if(xx>=w)break;
                  const s=(y*4+x)*4,d=(yy*w+xx)*4;
                  out[d]=px[s];out[d+1]=px[s+1];out[d+2]=px[s+2];out[d+3]=px[s+3];}}
            }
            return out;
          }

          function decodeRaw(dv,o,w,h,bpp,masks,lum,alphaOnly){
            const bytes=bpp>>3;
            if(![1,2,3,4].includes(bytes))throw new Error('Profundidade de pixel não suportada ('+bpp+' bits).');
            if(o+w*h*bytes>dv.byteLength)throw new Error('O arquivo parece estar incompleto.');
            const info=m=>{if(!m)return null;let s=0;while(!((m>>>s)&1))s++;let n=0;while((m>>>(s+n))&1&&s+n<32)n++;return{m,s,n};};
            const [R,G,B,A]=masks.map(info);
            if(!R&&!G&&!B&&!A)throw new Error('Formato de pixel não suportado.');
            const get=(v,c,d)=>c?Math.round(((v&c.m)>>>c.s)*255/(2**c.n-1)):d;
            const out=new Uint8ClampedArray(w*h*4);
            for(let i=0;i<w*h;i++){
              const q=o+i*bytes;
              const v=bytes===4?dv.getUint32(q,true):bytes===2?dv.getUint16(q,true):bytes===1?dv.getUint8(q):(dv.getUint8(q)|dv.getUint8(q+1)<<8|dv.getUint8(q+2)<<16);
              const d=i*4;
              if(alphaOnly){out[d]=out[d+1]=out[d+2]=255;out[d+3]=get(v,A,255);continue;}
              const r=get(v,R,0);
              out[d]=r;out[d+1]=(lum||(!G&&!B))?r:get(v,G,0);out[d+2]=(lum||(!G&&!B))?r:get(v,B,0);
              out[d+3]=get(v,A,255);
            }
            return out;
          }

          function parseDDS(buf,layer){layer=layer||0;
            const dv=new DataView(buf);
            if(buf.byteLength<128||dv.getUint32(0,true)!==0x20534444)throw new Error('Este não é um arquivo DDS válido.');
            const h=dv.getUint32(12,true), w=dv.getUint32(16,true);
            if(!w||!h||w>16384||h>16384)throw new Error('Dimensões inválidas ('+w+' × '+h+').');
            const pf=dv.getUint32(80,true), cc=dv.getUint32(84,true), bpp=dv.getUint32(88,true);
            const masks=[92,96,100,104].map(o=>dv.getUint32(o,true));
            const map={bc1:'BC1 (DXT1)',bc2:'BC2 (DXT3)',bc3:'BC3 (DXT5)',bc4:'BC4',bc5:'BC5'};
            let off=128, kind=null, raw=null;
            if(pf&4){
              const t={[FC('DXT1')]:'bc1',[FC('DXT2')]:'bc2',[FC('DXT3')]:'bc2',[FC('DXT4')]:'bc3',[FC('DXT5')]:'bc3',[FC('ATI1')]:'bc4',[FC('BC4U')]:'bc4',[FC('ATI2')]:'bc5',[FC('BC5U')]:'bc5'};
              if(cc===FC('DX10')){
                const f=dv.getUint32(128,true); off=148;
                const dx={71:'bc1',72:'bc1',74:'bc2',75:'bc2',77:'bc3',78:'bc3',80:'bc4',81:'bc4',83:'bc5',84:'bc5'};
                if(dx[f])kind=dx[f];
                else if(f===28||f===29)raw={bpp:32,masks:[0xFF,0xFF00,0xFF0000,0xFF000000]};
                else if(f===87||f===91)raw={bpp:32,masks:[0xFF0000,0xFF00,0xFF,0xFF000000]};
                else if(f===61)raw={bpp:8,masks:[0xFF,0,0,0],lum:true};
                else throw new Error('Formato DXGI '+f+' (como BC6H/BC7) ainda não é suportado.');
              }else if(t[cc])kind=t[cc];
              else throw new Error('Compressão “'+String.fromCharCode(cc&255,cc>>8&255,cc>>16&255,cc>>>24)+'” não suportada.');
            }else{
              raw={bpp,masks,lum:!!(pf&0x20000),alphaOnly:!!(pf&2)&&!(pf&0x40)&&!(pf&0x20000)};
            }
            const mips=Math.max(1,dv.getUint32(28,true)), arr=((pf&4)&&cc===FC('DX10'))?Math.max(1,dv.getUint32(140,true)):1;
            let stride=0;
            for(let l=0,lw=w,lh=h;l<mips;l++,lw=Math.max(1,lw>>1),lh=Math.max(1,lh>>1))stride+=kind?(((lw+3)>>2)*((lh+3)>>2)*((kind==='bc1'||kind==='bc4')?8:16)):Math.ceil(raw.bpp*lw/8)*lh;
            if(layer>=arr)throw new Error('camada inexistente no DDS.');
            off+=layer*stride;
            let rgba,label;
            if(kind){rgba=decodeBlocks(dv,off,w,h,kind);label=map[kind];}
            else{rgba=decodeRaw(dv,off,w,h,raw.bpp,raw.masks,raw.lum,raw.alphaOnly);label='Sem compressão, '+raw.bpp+' bits';}
            return{w,h,rgba,label,arr,dxt1:kind==='bc1'};
          }

          function paint(it){
            return;
            if(!it.rgba)return;
            const c=it.canvas, ctx=c.getContext('2d');
            c.width=it.w;c.height=it.h;
            let d=it.rgba;
            if($('#opaque').checked){d=new Uint8ClampedArray(it.rgba);for(let i=3;i<d.length;i+=4)d[i]=255;}
            ctx.putImageData(new ImageData(d,it.w,it.h),0,0);
          }

          async function pngBlob(it){
            const d=await it.load(), c=document.createElement('canvas');c.width=d.w;c.height=d.h;
            let px=d.rgba;
            if($('#opaque').checked){px=new Uint8ClampedArray(px);for(let i=3;i<px.length;i+=4)px[i]=255;}
            c.getContext('2d').putImageData(new ImageData(px,d.w,d.h),0,0);
            return await new Promise(r=>c.toBlob(r,'image/png'));
          }
          async function saveZip(files,zn){
            let dl=null;try{dl=await claude.use('downloads');}catch(e){}
            if(dl){try{await dl.save({filename:zn,data:zip(files)});}catch(e){if(e&&e.code!=='declined')alert('Não foi possível salvar: '+(e.message||e.code));}}
            else for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.data]));a.download=f.name.split('/').pop();document.body.appendChild(a);a.click();a.remove();}
          }
          async function savePNG(it){
            const name=it.name.replace(IMG,'')+'.png';
            const blob=await pngBlob(it);
            let dl=null;
            try{dl=await claude.use('downloads');}catch(e){}
            if(dl){
              try{await dl.save({filename:name,data:blob});}catch(e){if(e&&e.code!=='declined')alert('Não foi possível salvar: '+(e.message||e.code));}
            }else{
              const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
            }
          }

          function encodeASTC(it,opaque){
            const {w,h,rgba}=it, bw=(w+3)>>2, bh=(h+3)>>2;
            const out=new Uint8Array(16+bw*bh*16);
            out.set([0x13,0xAB,0xA1,0x5C,4,4,1,w&255,w>>8&255,w>>16&255,h&255,h>>8&255,h>>16&255,1,0,0]);
            const put=(o,pos,n,v)=>{for(let k=0;k<n;k++)if(v>>k&1)out[o+((pos+k)>>3)]|=1<<((pos+k)&7);};
            const px=new Float32Array(64), m=[0,0,0,0], q=[1,1,1,1];
            let bo=16;
            for(let by=0;by<bh;by++)for(let bx=0;bx<bw;bx++,bo+=16){
              m[0]=m[1]=m[2]=m[3]=0;
              for(let i=0;i<16;i++){
                const x=Math.min(bx*4+(i&3),w-1), y=Math.min(by*4+(i>>2),h-1), s=(y*w+x)*4;
                px[i*4]=rgba[s];px[i*4+1]=rgba[s+1];px[i*4+2]=rgba[s+2];px[i*4+3]=opaque?255:rgba[s+3];
                for(let c=0;c<4;c++)m[c]+=px[i*4+c]/16;
              }
              const C=new Float32Array(16);
              for(let i=0;i<16;i++)for(let a=0;a<4;a++)for(let b=0;b<4;b++)C[a*4+b]+=(px[i*4+a]-m[a])*(px[i*4+b]-m[b]);
              let v=[1,1,1,1];
              for(let k=0;k<4;k++){
                const n=[0,0,0,0];
                for(let a=0;a<4;a++)for(let b=0;b<4;b++)n[a]+=C[a*4+b]*v[b];
                const len=Math.hypot(...n);
                if(len<1e-6)break;
                v=n.map(x=>x/len);
              }
              let tmin=1e9,tmax=-1e9;
              for(let i=0;i<16;i++){let t=0;for(let c=0;c<4;c++)t+=(px[i*4+c]-m[c])*v[c];if(t<tmin)tmin=t;if(t>tmax)tmax=t;}
              let e0=[0,1,2,3].map(c=>Math.max(0,Math.min(255,Math.round(m[c]+v[c]*tmin))));
              let e1=[0,1,2,3].map(c=>Math.max(0,Math.min(255,Math.round(m[c]+v[c]*tmax))));
              if(e1[0]+e1[1]+e1[2]<e0[0]+e0[1]+e0[2]){const t=e0;e0=e1;e1=t;}
              const d=e1.map((x,c)=>x-e0[c]), dd=d[0]*d[0]+d[1]*d[1]+d[2]*d[2]+d[3]*d[3];
              put(bo,0,11,0x42);      // bloco 4x4, pesos de 2 bits
              put(bo,13,4,12);        // endpoints RGBA diretos
              for(let c=0;c<4;c++){put(bo,17+(c*2)*8,8,e0[c]);put(bo,17+(c*2+1)*8,8,e1[c]);}
              for(let i=0;i<16;i++){
                let t=0;
                if(dd>0){for(let c=0;c<4;c++)t+=(px[i*4+c]-e0[c])*d[c];t/=dd;}
                const wgt=t<.164?0:t<.5?1:t<.836?2:3;
                put(bo,127-i*2,1,wgt&1);put(bo,126-i*2,1,wgt>>1&1);
              }
            }
            return out;
          }

          function crc32(u){
            if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t.push(c>>>0);}}
            let r=-1;for(let i=0;i<u.length;i++)r=crc32.t[(r^u[i])&255]^(r>>>8);
            return (r^-1)>>>0;
          }
          function zip(files){
            const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
            for(const f of files){
              const n=enc.encode(f.name), crc=crc32(f.data), sz=f.data.length;
              const lh=new DataView(new ArrayBuffer(30));
              lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(12,0x21,true);
              lh.setUint32(14,crc,true);lh.setUint32(18,sz,true);lh.setUint32(22,sz,true);lh.setUint16(26,n.length,true);
              parts.push(lh.buffer,n,f.data);
              const ch=new DataView(new ArrayBuffer(46));
              ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(14,0x21,true);
              ch.setUint32(16,crc,true);ch.setUint32(20,sz,true);ch.setUint32(24,sz,true);ch.setUint16(28,n.length,true);ch.setUint32(42,off,true);
              cd.push(ch.buffer,n);off+=30+n.length+sz;
            }
            let cs=0;for(const p of cd)cs+=p.byteLength||p.length;
            const e=new DataView(new ArrayBuffer(22));
            e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cs,true);e.setUint32(16,off,true);
            return new Blob([...parts,...cd,e.buffer],{type:'application/zip'});
          }
          async function saveAST(its,btn){
            const old=btn.textContent;btn.disabled=true;btn.textContent='Convertendo…';
            try{
              const ext=$('#ext').value, opq=$('#opaque').checked, files=[];
              for(const it of its){
                btn.textContent='Convertendo '+(files.length+1)+'/'+its.length+'…';
                await new Promise(r=>setTimeout(r,15));
                files.push({name:(it.path||it.name).replace(IMG,'')+'.ast',data:await buildAst(it,SC(),FL())});
                setProg(files.length,its.length,'Convertendo para AST');
              }
              let dl=null;try{dl=await claude.use('downloads');}catch(e){}
              if(dl){
                const zn=its.length===1?files[0].name.split('/').pop().replace(/\.[^.]+$/,'')+'.zip':'texturas-ast.zip';
                try{await dl.save({filename:zn,data:zip(files)});}catch(e){if(e&&e.code!=='declined')alert('Não foi possível salvar: '+(e.message||e.code));}
              }else{
                for(const f of files){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([f.data]));a.download=f.name.split('/').pop();document.body.appendChild(a);a.click();a.remove();}
              }
            }catch(e){alert('Falha ao converter: '+(e.message||e));}
            btn.disabled=false;btn.textContent=old;
          }

          function addCard(file,res,error,lazy){
            const card=document.createElement('div');card.className='card';
            if(error){
              const e=document.createElement('div');e.className='err';
              e.textContent=(file.path||file.name)+': '+error;card.appendChild(e);
              $('#list').prepend(card);$('#fl').open=true;return;
            }
            const it={name:file.name,path:file.path||file.name,w:res.w,h:res.h,rgba:lazy?null:res.rgba,canvas:document.createElement('canvas')};
            it.load=lazy||(async()=>it);it.z=curZip;it.raw=file.raw;
            const pic=document.createElement('div');pic.className='pic';pic.appendChild(it.canvas);
            const meta=document.createElement('div');meta.className='meta';
            const info=document.createElement('div');
            const b=document.createElement('b');b.textContent=(file.path||file.name).replace(IMG,'')+'.png';
            const s=document.createElement('small');s.textContent=res.w+' × '+res.h+' px · '+res.label;
            info.append(b,s);
            const btn=document.createElement('button');btn.textContent='Baixar PNG';
            btn.onclick=()=>savePNG(it);
            const bAst=document.createElement('button');bAst.className='ghost';bAst.textContent='Baixar AST';
            bAst.onclick=()=>saveAST([it],bAst);
            const btns=document.createElement('div');btns.className='btns';btns.append(btn,bAst);
            meta.append(info,btns);card.append(meta);
            $('#list').prepend(card);
            items.push(it);
            $('#cnt').textContent=items.length;
            $('#bar').hidden=false;
          }

          async function readZip(buf){
            const dv=new DataView(buf),u=new Uint8Array(buf);
            let e=-1;
            for(let i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break;}
            if(e<0)throw new Error('Este não é um arquivo .zip válido.');
            const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out=[];
            for(let k=0;k<n;k++){
              if(dv.getUint32(p,true)!==0x02014b50)throw new Error('Índice do .zip danificado.');
              const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);
