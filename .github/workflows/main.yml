            }
            const ci=document.createElement('input');ci.type='color';ci.value=o.color;ci.oninput=()=>{o.color=ci.value;drawModel();};row('Cor',ci);
            const bar=document.createElement('div');bar.className='btns';
            const b1=document.createElement('button');b1.className='ghost';b1.textContent='Duplicar';
            b1.onclick=()=>{const id=++MD.n;MD.objs.push({...o,id,name:o.name+'_copia',pos:[o.pos[0]+.5,o.pos[1],o.pos[2]+.5],rot:[...o.rot],scl:[...o.scl]});MD.sel=id;renderModelUI();drawModel();};
            const b2=document.createElement('button');b2.className='ghost';b2.textContent='Excluir';
            b2.onclick=()=>{MD.objs=MD.objs.filter(x=>x.id!==o.id);MD.sel=null;renderModelUI();drawModel();};
            bar.append(b1,b2);Pn.append(bar);
          }
          function genI3d(name){
            const f=v=>(+v.toFixed(6)).toString(),esc=t=>t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
            const cols=[...new Set(MD.objs.map(o=>o.color))];
            const mats=cols.map((c,i)=>'    <Material name="mat_'+(i+1)+'" materialId="'+(i+1)+'" diffuseColor="'+[1,3,5].map(k=>f(parseInt(c.slice(k,k+2),16)/255)).join(' ')+' 1"/>').join('\n');
            let shapes='',scene='',nid=2;
            MD.objs.forEach((o,i)=>{
              const V=[],I=[];
              unitMesh(o.type).forEach((t,k)=>{
                const n=triN(t),ax=Math.abs(n[0]),ay=Math.abs(n[1]),az=Math.abs(n[2]);
                t.forEach(p=>{const uv=ax>=ay&&ax>=az?[p[2]+.5,p[1]+.5]:ay>=az?[p[0]+.5,p[2]+.5]:[p[0]+.5,p[1]+.5];
                  V.push('        <v p="'+p.map(f).join(' ')+'" n="'+n.map(f).join(' ')+'" t0="'+uv.map(f).join(' ')+'"/>');});
                I.push('        <t i="'+(k*3)+' '+(k*3+1)+' '+(k*3+2)+'"/>');
              });
              shapes+='    <IndexedTriangleSet name="'+esc(o.name)+'" shapeId="'+(i+1)+'">\n      <Vertices count="'+V.length+'" normal="true" uv0="true">\n'+V.join('\n')+'\n      </Vertices>\n      <Subsets count="1">\n        <Subset firstVertex="0" numVertices="'+V.length+'" firstIndex="0" numIndices="'+I.length*3+'"/>\n      </Subsets>\n      <Triangles count="'+I.length+'">\n'+I.join('\n')+'\n      </Triangles>\n    </IndexedTriangleSet>\n';
              scene+='      <Shape name="'+esc(o.name)+'" translation="'+o.pos.map(f).join(' ')+'" rotation="'+o.rot.map(f).join(' ')+'" scale="'+o.scl.map(f).join(' ')+'" nodeId="'+(nid++)+'" shapeId="'+(i+1)+'" materialIds="'+(cols.indexOf(o.color)+1)+'" castsShadows="true" receiveShadows="true"/>\n';
            });
            return '<?xml version="1.0" encoding="iso-8859-1"?>\n<i3D name="'+esc(name)+'" version="1.6" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xsi:noNamespaceSchemaLocation="http://i3d.giants.ch/schema/i3d-1.6.xsd">\n  <Asset>\n    <Export program="GIANTS Editor 64bit" version="9.0.0"/>\n  </Asset>\n  <Files/>\n  <Materials>\n'+mats+'\n  </Materials>\n  <Shapes>\n'+shapes+'  </Shapes>\n  <Dynamics/>\n  <Scene>\n    <TransformGroup name="'+esc(name)+'" nodeId="1">\n'+scene+'    </TransformGroup>\n  </Scene>\n  <UserAttributes/>\n</i3D>\n';
          }
          const mName=()=>($('#mName').value||'meu_modelo').trim().replace(/[^\w-]+/g,'_')||'meu_modelo';
          const mHas=()=>{if(!MD.objs.length){alert('Adicione ao menos uma forma.');return false;}return true;};
          document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>addObj(b.dataset.t));
          $('#mOpen').onclick=()=>{if(mHas())openI3D(genI3d(mName()),mName()+'.i3d',null);};
          $('#mDl').onclick=()=>{if(!mHas())return;const d=new TextEncoder().encode(genI3d(mName()));saveBlob(zipRaw([{name:mName()+'.i3d',data:d,method:0,crc:crc32(d),usz:d.length}]),mName()+'.zip');};
          $('#mSend').onclick=()=>{if(!mHas())return;mk.files.push(new File([genI3d(mName())],mName()+'.i3d',{type:'text/xml'}));renderMk();setTab('make');};
          const mcv=$('#mcv');
          mcv.addEventListener('pointerdown',e=>{mcv.setPointerCapture(e.pointerId);MD.ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});MD.moved=0;});
          mcv.addEventListener('pointermove',e=>{
            const p=MD.ptr.get(e.pointerId);if(!p)return;
            if(MD.ptr.size===2){
              const v=[...MD.ptr.values()],d0=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
              p.x=e.clientX;p.y=e.clientY;
              const d1=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);
              MD.dist=Math.max(2,Math.min(60,MD.dist*d0/Math.max(d1,1)));MD.moved=9;
            }else{
              MD.yaw-=(e.clientX-p.x)*.01;MD.pitch=Math.max(-1.4,Math.min(1.4,MD.pitch+(e.clientY-p.y)*.01));
              MD.moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);p.x=e.clientX;p.y=e.clientY;
            }
            drawModel();
          });
          mcv.addEventListener('pointerup',e=>{const had=MD.ptr.delete(e.pointerId);if(had&&MD.moved<6&&!MD.ptr.size)pickAt(e);});
          mcv.addEventListener('pointercancel',e=>MD.ptr.delete(e.pointerId));
          mcv.addEventListener('wheel',e=>{e.preventDefault();MD.dist=Math.max(2,Math.min(60,MD.dist*(1+Math.sign(e.deltaY)*.1)));drawModel();},{passive:false});
          window.addEventListener('resize',drawModel);
          $('#pickdir').onclick=()=>$('#dir').click();
          $('#dir').addEventListener('change',e=>{handle([...e.target.files]);e.target.value='';});
          $('#opaque').addEventListener('change',()=>items.forEach(paint));
          $('#all').onclick=async e=>{
            const btn=e.currentTarget,old=btn.textContent;btn.disabled=true;
            try{
              const files=[];
              for(let i=0;i<items.length;i++){
                const it=items[i];
                btn.textContent='Convertendo '+(i+1)+'/'+items.length+'…';
                await new Promise(r=>setTimeout(r,0));
                const b=await pngBlob(it);
                files.push({name:(it.path||it.name).replace(IMG,'')+'.png',data:new Uint8Array(await b.arrayBuffer())});
                setProg(i+1,items.length,'Convertendo para PNG');
              }
              await saveZip(files,'texturas-png.zip');
            }catch(err){alert('Falha ao converter: '+(err.message||err));}
            btn.disabled=false;btn.textContent=old;
          };
          $('#allast').onclick=()=>saveAST([...items],$('#allast'));
          $('#clear').onclick=()=>{items.length=0;$('#list').textContent='';$('#modbar').textContent='';$('#cnt').textContent='0';$('#prog').hidden=true;$('#bar').hidden=true;};
          </script>
          </body>
          </html>
